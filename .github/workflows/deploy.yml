name: Deploy to GitHub Pages

# 纯静态部署：只跑 build，产物 dist/ 直接作为 Pages artifact。
# 全部使用 GitHub 官方 action（actions/checkout、setup-node、configure-pages、
# upload-pages-artifact、deploy-pages），不依赖任何第三方 action。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # vite@8 要求 ^20.19.0 || >=22.12.0；用 22 LTS，避开 Node 20 的弃用告警
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
